# Gitleaks configuration.
#
# Gitleaks finds this file on its own - the CI job passes it as GITLEAKS_CONFIG -
# and a config that is given replaces the built-in rules. `[extend]` below is
# what keeps them: without it this file would be the whole rule set, and since it
# only names allow-listed findings, the scan would run no rules at all and could
# not fail. Then, and only then, the allowlist is what turns the scan into a
# gate: anything not named here fails the job.
title = "CPU Manager"

[extend]
useDefault = true

[allowlist]
description = "Public keys and documentation that look like credentials"

# Match the allowlist against the whole line a finding came from, not only
# against the extracted secret: a base64 blob that trips an entropy rule is
# rarely detected in full.
regexTarget = "line"

paths = [
    # The minisign public key is meant to be published; it verifies signatures,
    # it does not create them. The private key (tauri.key) is gitignored and is
    # exactly what this scan exists to catch.
    '''src-tauri/tauri\.pubkey$''',
]

regexes = [
    # The same public key, quoted in src-tauri/tauri.conf.json and in
    # docs/UPDATER.md as the `-P` argument of a `minisign -V` example.
    '''RWR9f2sLThYL\+G8XW2/Q5SDT1GF\+jUTHTgZAtSY55Gh0aWSp4ldk30O''',
    '''dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk''',
]
